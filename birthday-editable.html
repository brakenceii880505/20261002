function introPanel() { return `<section class="birthday-intro" aria-labelledby="intro-title"><div class="intro-stars" aria-hidden="true"><span>✦</span><span>♡</span><span>✦</span><span>⋆</span></div><div class="intro-envelope" aria-hidden="true"><div class="envelope-flap"></div><div class="envelope-letter"><span>給 ${escapeHtml(birthdayData.recipientName)}</span><b>♥</b></div><div class="envelope-heart">♥</div></div><div class="intro-copy"><span class="intro-kicker">A LITTLE BIRTHDAY SECRET</span><h1 id="intro-title">有一封信，<br /><em>只為妳打開。</em></h1><p>今天的生日祝福沒有放在普通的卡片裡，<br />而是藏在一座只屬於妳的可愛遊樂場。</p><div class="intro-note"><span>♡</span><span>請壽星親自開門</span><span>♡</span></div><button class="portal-button" type="button" data-action="enter-portal"><span class="portal-door">↗</span> 打開信件</button><small class="intro-hint">裡面有遊戲、驚喜，還有一封最後才能看到的信</small></div></section>`; }

function catchPanel() { const running = state.catchStarted; return `<section class="catch-panel" aria-labelledby="catch-title"><div class="catch-topline"><span>STAGE 01 · REACTION RUSH</span><b>${state.catchScore} / ${birthdayData.catchGoal} HITS</b></div><div class="catch-copy"><span class="neon-pill">NO SLOW MOTION</span><h1 id="catch-title">抓住那顆<br /><em>逃跑的生日星！</em></h1><p>${running ? "它會一直換位置，手速慢一點就只抓到空氣。準備好了嗎？" : "第一關先考驗反應力。限時抓到會逃跑的生日彩蛋，才可以拿到遊樂場入場券。"}</p></div><div class="catch-arena ${running ? "is-running" : "is-ready"}"><div class="catch-arena-grid"></div><div class="catch-hud"><span class="catch-time">TIME <b>${String(state.catchTime).padStart(2, "0")}</b></span><span>HITS <b>${state.catchScore} / ${birthdayData.catchGoal}</b></span></div>${running ? `<button class="catch-target" type="button" data-catch style="left:${state.catchX}%;top:${state.catchY}%" aria-label="抓住生日目標">${birthdayData.catchTargets[state.catchTarget]}<small>抓我呀</small></button>` : `<div class="catch-preview" aria-hidden="true"><span>🎈</span><b>${state.catchTime === 0 ? "再試一次" : "READY?"}</b><span>✦</span></div>`}</div><div class="catch-footer"><span>${running ? "目標正在逃跑中..." : `需要在 ${birthdayData.catchSeconds} 秒內抓到 ${birthdayData.catchGoal} 次`}</span><button class="catch-start" type="button" data-action="start-catch">${running ? "GO!" : state.catchTime === 0 ? "RETRY ROUND" : "START ROUND"} ✦</button></div></section>`; }

function whackPanel() { const running = state.whackStarted; const cells = Array.from({ length: 9 }, (_, index) => { const isTarget = running && state.whackTargetIndex === index; const isDecoy = running && state.whackDecoyIndices.includes(index); const icon = isTarget ? birthdayData.whackTarget : isDecoy ? birthdayData.whackDecoys[index % birthdayData.whackDecoys.length] : "·"; return `<button class="whack-cell ${isTarget ? "is-target" : ""} ${isDecoy ? "is-decoy" : ""}" type="button" data-whack="${index}" aria-label="${isTarget ? "生日蛋糕" : isDecoy ? "搗蛋鬼" : "空格"}">${icon}</button>`; }).join(""); return `<section class="whack-panel" aria-labelledby="whack-title"><div class="whack-topline"><span>STAGE 02 · WHACK THE TROUBLEMAKER</span><b>${state.whackScore} / ${birthdayData.whackGoal} CAKES</b></div><div class="whack-copy"><span class="neon-pill">BIRTHDAY BOP</span><h1 id="whack-title">蛋糕出沒，<em>搗蛋鬼滾開！</em></h1><p>${running ? "只點蛋糕，別被鬼臉騙走！點錯會扣愛心。" : "第二關不是找東西，是打地鼠！抓住蛋糕、避開搗蛋鬼，拿到 " + birthdayData.whackGoal + " 分才算過關。"}</p></div><div class="whack-scoreboard"><span>TIME <b>${String(state.whackTime).padStart(2, "0")}</b></span><span class="heart-lives">${"♥".repeat(state.whackLives)}<i>${"♡".repeat(Math.max(0, birthdayData.whackLives - state.whackLives))}</i></span><span>MISS <b>${birthdayData.whackLives - state.whackLives} / ${birthdayData.whackLives}</b></span></div><div class="whack-board ${running ? "is-running" : "is-ready"}">${cells}${!running ? `<div class="whack-cover"><span>🍰</span><b>${state.whackTime === 0 || state.whackLives === 0 ? "再來一次" : "READY?"}</b><small>小心，鬼會騙妳</small></div>` : ""}</div><div class="whack-footer"><span>${running ? "蛋糕會換位置，眼睛跟上！" : `限時 ${birthdayData.whackSeconds} 秒，抓 ${birthdayData.whackGoal} 個蛋糕`}</span><button class="whack-start" type="button" data-action="start-whack">${running ? "GO!" : state.whackTime === 0 || state.whackLives === 0 ? "RETRY ROUND" : "START ROUND"} ✦</button></div></section>`; }

function objectPanel() { const positions = ["left:12%;top:21%", "left:73%;top:25%", "left:49%;top:12%", "left:20%;top:67%", "left:76%;top:69%"]; const found = state.foundObjects.length; return `<section class="object-panel" aria-labelledby="object-title"><div class="object-topline"><span>STAGE 03 · BIRTHDAY ROOM</span><b>${found} / ${birthdayData.objects.length} FOUND</b></div><div class="object-copy"><span class="neon-pill">LOOK CLOSER</span><h1 id="object-title">房間裡藏了五個<br /><em>只給妳的生日彩蛋</em></h1><p>不是找東西那麼簡單喔。把房間裡會發光的小可愛全部點出來，才拿得到下一關的通行證。</p></div><div class="object-room"><div class="room-shelf"></div><div class="room-window">✦<small>今天也要閃閃發光</small></div><div class="room-rug"></div>${birthdayData.objects.map((item, index) => `<button class="hidden-object object-${item.id} ${state.foundObjects.includes(item.id) ? "is-found" : ""}" type="button" data-object="${item.id}" style="${positions[index]}" aria-label="尋找${escapeHtml(item.label)}"><span>${item.emoji}</span><small>${state.foundObjects.includes(item.id) ? "找到了！" : "點我"}</small></button>`).join("")}<div class="room-sign">BIRTHDAY<br /><b>FOR YOU</b></div></div><div class="object-progress">${birthdayData.objects.map((item) => `<span class="object-dot ${state.foundObjects.includes(item.id) ? "is-found" : ""}">${state.foundObjects.includes(item.id) ? "✓" : "?"}</span>`).join("")}</div><p class="object-hint">${found === 0 ? "提示：有些彩蛋很會躲，仔細看每個角落～" : found === birthdayData.objects.length ? "全部找到！生日房間對妳投降了 ♡" : `已找到 ${found} 個，還有 ${birthdayData.objects.length - found} 個在偷看妳。`}</p></section>`; }

function memoryPanel() { const round = birthdayData.memoryRounds[state.memoryRound]; const showingText = state.memoryShowing ? "燈號記好了嗎？現在輪到妳重播！" : state.memoryStarted ? `已輸入 ${state.memoryInput.length} / ${round.sequence.length}，不要被生日氣氛騙走喔` : "按下開始，記住接下來閃過的順序"; return `<section class="memory-panel" aria-labelledby="memory-title"><div class="memory-topline"><span>STAGE 04 · MEMORY SIGNAL</span><b>ROUND ${state.memoryRound + 1} / ${birthdayData.memoryRounds.length}</b></div><div class="memory-copy"><span class="neon-pill">${escapeHtml(round.title)}</span><h2 id="memory-title">生日 DJ 在放燈號</h2><p>${escapeHtml(round.tease)}<br />先看順序，再照順序按回去。</p></div><div class="memory-machine"><div class="memory-lights">${birthdayData.memoryButtons.map((button, index) => `<button class="memory-button memory-${button.color} ${state.litButton === index ? "is-lit" : ""} ${state.memoryInput[state.memoryInput.length - 1] === index ? "is-last" : ""}" type="button" data-memory="${index}" aria-label="${escapeHtml(button.label)}燈號" ${state.memoryShowing || !state.memoryStarted ? "disabled" : ""}><span>${button.symbol}</span><small>${escapeHtml(button.label)}</small></button>`).join("")}</div><div class="memory-readout"><span class="readout-light"></span><span>${showingText}</span></div><button class="memory-start" type="button" data-action="start-memory" ${state.memoryShowing ? "disabled" : ""}>${state.memoryStarted && !state.memoryShowing ? "再看一次順序" : state.memoryRound === 0 && !state.memoryStarted ? "開始記憶挑戰" : "播放燈號"} ✦</button></div><div class="memory-progress">${birthdayData.memoryRounds.map((_, index) => `<span class="memory-round-dot ${index < state.memoryRound ? "is-done" : ""} ${index === state.memoryRound ? "is-current" : ""}">${index < state.memoryRound ? "✓" : index + 1}</span>`).join("")}</div></section>`; }

function codePanel() { return `<section class="vault-panel" aria-labelledby="code-title"><div class="vault-copy"><span class="section-kicker">STAGE 05 · PASSWORD VAULT</span><h2 id="code-title">最後一關：生日密碼</h2><p>${escapeHtml(birthdayData.codeHint)}<br />前面四關都過了，這題不准被自己的生日難倒。</p></div><div class="code-form"><label class="sr-only" for="secretCode">生日密碼</label><input id="secretCode" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="••••" /><button type="button" data-action="unlock">UNLOCK ✦</button></div></section>`; }
function letterPanel() { return `<section class="final-ticket" aria-labelledby="letter-title"><div class="ticket-head"><span>CONGRATULATIONS</span><b>★ ★ ★</b></div><div class="ticket-body"><span class="section-kicker">FINAL STAGE · BIRTHDAY LETTER</span><h2 id="letter-title">${escapeHtml(fill(birthdayData.letterTitle))}</h2><div class="letter-copy">${birthdayData.letter.map((paragraph) => `<p>${escapeHtml(fill(paragraph))}</p>`).join("")}</div><p class="signoff">${escapeHtml(birthdayData.signoff)}<br /><span>♥</span></p><button class="reset-button" type="button" data-action="reset">REPLAY THE ARCADE</button></div><div class="ticket-tail"><span>KEEP THIS DAY BRIGHT</span><span>${escapeHtml(birthdayData.birthday)}</span></div></section>`; }

function render() { const stageLabel = !state.introSeen ? "INVITATION" : state.unlocked ? "FINAL LETTER" : state.stage === "catch" ? "STAGE 01" : state.stage === "whack" ? "STAGE 02" : state.stage === "memory" ? "STAGE 04" : state.stage === "objects" ? "STAGE 03" : "STAGE 05"; const boardProgress = !state.introSeen ? "OPEN THE DOOR" : state.stage === "catch" ? `${state.catchScore} / ${birthdayData.catchGoal} HITS` : state.stage === "whack" ? `${state.whackScore} / ${birthdayData.whackGoal} CAKES` : state.stage === "objects" ? `${state.foundObjects.length} / ${birthdayData.objects.length} FOUND` : state.stage === "memory" ? `ROUND ${state.memoryRound + 1} / 03` : state.stage === "code" ? "VAULT READY" : "CLEAR"; const content = !state.introSeen ? introPanel() : state.unlocked ? letterPanel() : state.stage === "catch" ? catchPanel() : state.stage === "whack" ? whackPanel() : state.stage === "objects" ? objectPanel() : state.stage === "memory" ? memoryPanel() : codePanel(); app.innerHTML = `<main class="arcade-page ${state.introSeen ? "" : "intro-mode"}"><header class="arcade-header"><a class="arcade-brand" href="/" aria-label="回到心動任務"><span class="brand-ticket">BD</span><span><small>BIRTHDAY ARCADE</small><strong>${escapeHtml(birthdayData.recipientName)}'S DAY</strong></span></a><div class="header-actions"><button class="music-toggle ${state.musicOn ? "is-on" : ""}" type="button" data-action="toggle-music">♫ ${state.musicOn ? "MUSIC ON" : "MUSIC OFF"}</button><span class="edition-tag">${stageLabel}<b>${escapeHtml(birthdayData.birthday)}</b></span></div></header><section class="arcade-board ${state.unlocked ? "is-unlocked" : ""}"><div class="board-topline"><span>MISSION 001 · ONE DAY ONLY</span><span>${boardProgress}</span></div>${content}</section><footer class="arcade-footer"><span>birthday arcade / made for one special person</span><span>✦ ✦ ✦</span></footer></main>`; }

function startCatch() { if (state.catchStarted) return; clearCatchTimer(); state.catchStarted = true; state.catchScore = 0; state.catchTime = birthdayData.catchSeconds; moveCatchTarget(); render(); state.catchInterval = window.setInterval(() => { state.catchTime -= 1; if (state.catchTime <= 0) { state.catchTime = 0; state.catchStarted = false; clearCatchTimer(); render(); showToast("時間到！生日彩蛋笑妳抓不到，再挑戰一次啦 😼", "error"); return; } moveCatchTarget(); render(); }, 1000); }
function handleCatchTap() { if (state.stage !== "catch" || !state.catchStarted) return; state.catchScore += 1; if (state.catchScore >= birthdayData.catchGoal) { clearCatchTimer(); state.catchStarted = false; state.stage = "whack"; render(); showToast("反應力通關！第二關來打跑搗蛋鬼！", "success"); return; } moveCatchTarget(); render(); }
function startWhack() { if (state.whackStarted) return; clearWhackTimer(); state.whackStarted = true; state.whackScore = 0; state.whackTime = birthdayData.whackSeconds; state.whackLives = birthdayData.whackLives; moveWhackBoard(); render(); state.whackInterval = window.setInterval(() => { state.whackTime -= 1; if (state.whackTime <= 0) { state.whackTime = 0; state.whackStarted = false; clearWhackTimer(); render(); showToast("搗蛋鬼拖時間成功！再打一次給它看 😈", "error"); return; } moveWhackBoard(); render(); }, 1000); }
function handleWhackTap(index) { if (state.stage !== "whack" || !state.whackStarted) return; if (index === state.whackTargetIndex) { state.whackScore += 1; if (state.whackScore >= birthdayData.whackGoal) { clearWhackTimer(); state.whackStarted = false; state.stage = "objects"; render(); showToast("搗蛋鬼被打跑了！下一關要在房間裡找彩蛋～", "success"); return; } moveWhackBoard(); render(); return; } if (state.whackDecoyIndices.includes(index)) { state.whackLives -= 1; if (state.whackLives <= 0) { state.whackLives = 0; state.whackStarted = false; clearWhackTimer(); render(); showToast("妳把搗蛋鬼當蛋糕了！三顆愛心用光，重來一次～", "error"); return; } showToast("這是搗蛋鬼啦！愛心被偷走一顆 😈", "error"); } else { showToast("打到空氣！蛋糕剛剛在別格偷笑～", "error"); } moveWhackBoard(); render(); }
function handleObjectTap(id) { if (state.stage !== "objects" || state.foundObjects.includes(id)) return; const item = birthdayData.objects.find((object) => object.id === id); if (!item) return; state.foundObjects.push(id); render(); showToast(item.clue, "success"); if (state.foundObjects.length === birthdayData.objects.length) { window.setTimeout(() => { state.stage = "memory"; render(); showToast("五個彩蛋都找到了！第四關記憶燈號登場！", "success"); }, 850); } }

function playMemorySequence() { clearMemoryTimer(); const round = birthdayData.memoryRounds[state.memoryRound]; state.memoryShowing = true; state.memoryStarted = true; state.memoryInput = []; state.litButton = null; render(); let index = 0; const next = () => { if (index >= round.sequence.length) { state.litButton = null; state.memoryShowing = false; render(); return; } state.litButton = round.sequence[index]; render(); state.memoryTimer = window.setTimeout(() => { state.litButton = null; render(); state.memoryTimer = window.setTimeout(() => { index += 1; next(); }, 220); }, 480); }; next(); }
function handleMemoryTap(index) { if (state.stage !== "memory" || state.memoryShowing || !state.memoryStarted) return; const round = birthdayData.memoryRounds[state.memoryRound]; const expected = round.sequence[state.memoryInput.length]; if (index !== expected) { const failedAt = state.memoryInput.length + 1; state.memoryInput = []; state.memoryStarted = false; render(); showToast(`哎呀！第 ${failedAt} 顆就被抓到了，這回合要重來啦 😼`, "error"); return; } state.memoryInput.push(index); if (state.memoryInput.length === round.sequence.length) { const finished = state.memoryRound === birthdayData.memoryRounds.length - 1; state.memoryRound += finished ? 0 : 1; state.memoryInput = []; state.memoryStarted = false; if (finished) { state.stage = "code"; render(); showToast("三回合全過！最後只剩生日密碼了！", "success"); } else { render(); showToast("回合通過！下一回合會更壞一點點 😈", "success"); } } else { render(); } }

function handleClick(event) { const catchButton = event.target.closest("[data-catch]"); if (catchButton) { handleCatchTap(); return; } const whackButton = event.target.closest("[data-whack]"); if (whackButton) { handleWhackTap(Number(whackButton.dataset.whack)); return; } const memoryButton = event.target.closest("[data-memory]"); if (memoryButton) { handleMemoryTap(Number(memoryButton.dataset.memory)); return; } const objectButton = event.target.closest("[data-object]"); if (objectButton) { handleObjectTap(objectButton.dataset.object); return; } const action = event.target.closest("[data-action]")?.dataset.action; if (action === "enter-portal") { state.introSeen = true; render(); showToast("任意門開啟！第一關要抓住逃跑的生日星～", "success"); return; } if (action === "toggle-music") { if (!music) return; if (state.musicOn) { music.pause(); state.musicOn = false; render(); showToast("音樂先休息一下，等妳再叫它～", "success"); } else { music.volume = 0.32; music.play().then(() => { state.musicOn = true; render(); showToast("抒情小歌開唱，繼續闖關吧 ♫", "success"); }).catch(() => showToast("請再按一次音樂按鈕開始播放～", "error")); } return; } if (action === "start-catch") { startCatch(); return; } if (action === "start-whack") { startWhack(); return; } if (action === "start-memory") { playMemorySequence(); return; } if (action === "unlock") { const input = document.querySelector("#secretCode"); if (input?.value.trim() === birthdayData.secretCode) { state.unlocked = true; render(); showToast("PASSWORD ACCEPTED · 生日信已解鎖！", "success"); } else { state.codeWrong += 1; input?.classList.add("is-wrong"); window.setTimeout(() => input?.classList.remove("is-wrong"), 450); showToast(state.codeWrong > 1 ? "妳跟生日密碼吵架了嗎？再試一次～" : "密碼不對喔～提示在上面，再試一次！", "error"); input?.focus(); } return; } if (action === "reset") { clearMemoryTimer(); clearCatchTimer(); clearWhackTimer(); state.introSeen = false; state.stage = "catch"; state.unlocked = false; state.catchStarted = false; state.catchScore = 0; state.catchTime = birthdayData.catchSeconds; state.whackStarted = false; state.whackScore = 0; state.whackTime = birthdayData.whackSeconds; state.whackLives = birthdayData.whackLives; state.foundObjects = []; state.memoryRound = 0; state.memoryInput = []; state.memoryShowing = false; state.memoryStarted = false; state.litButton = null; state.codeWrong = 0; render(); showToast("信封重新封好，任意門等妳再開一次！", "success"); } }

document.addEventListener("click", handleClick);
render();

</script>
  </body>
</html>
